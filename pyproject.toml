[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimaxbrain"
version = "0.3.1"
description = "Direct paged-MMB MoE runtime integrated with llama.cpp/GGML"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE.md"}
authors = [{name = "MiniMaxBrain Project author"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]

[project.scripts]
mmb = "minimaxbrain.cli:main"

[tool.setuptools.packages.find]
include = ["minimaxbrain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
